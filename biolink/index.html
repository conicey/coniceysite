<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>conicey luv</title>

<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #000000;
  --ink: #f1f1ee;
  --ink-dim: #8f8f95;
  --ink-dimmer: #5c5c62;
  --ink-faint: #333338;
  --line: rgba(255,255,255,0.14);
  --line-soft: rgba(255,255,255,0.07);
  --line-strong: rgba(255,255,255,0.5);
  --panel: rgba(4,4,4,0.9);
}

html { background: var(--bg); }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* fixed ascii/dot-matrix art watermark (SVG, no font dependency) */
.art-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  pointer-events: none;
  user-select: none;
}
.art-bg svg { opacity: 0.2; }
.art-bg svg path { fill: #ffffff; }

/* vignette */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,255,255,0.05), transparent 60%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0,0,0,0.65), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* scanlines */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
  );
  pointer-events: none;
  z-index: 0;
}

.shell {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

/* breadcrumb nav */
.crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 34px;
}
.crumb a {
  color: var(--ink-dim);
  text-decoration: none;
  transition: color 0.15s;
}
.crumb a:hover { color: var(--ink); }
.crumb span.sep { color: var(--ink-faint); }
.crumb span.here { color: var(--ink-dimmer); }

/* page heading */
.page-head { margin-bottom: 36px; }
.page-title {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ink);
  text-transform: uppercase;
  display: inline-block;
}
.page-title::after {
  content: '_';
  color: var(--ink-dimmer);
  animation: blink 1.4s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

.page-sub {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--ink-dimmer);
  text-transform: uppercase;
}

/* generic section/box card - used across all subpages */
.box {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-left: 2px solid var(--line-strong);
  padding: 24px 26px;
  margin-bottom: 16px;
  position: relative;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  line-height: 1.7;
  font-size: 13px;
  color: var(--ink-dim);
}
.box:hover {
  border-left-color: #ffffff;
  box-shadow: -4px 0 24px rgba(255,255,255,0.05);
}
.box h2 {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 14px;
  font-weight: 700;
}
.box h2::before { content: '// '; color: var(--ink-faint); }
.box p { margin-bottom: 0; }
.box p + p { margin-top: 12px; }
.box b, .box strong { color: var(--ink); font-weight: 700; }
.box ul { list-style: none; margin-top: 10px; }
.box ul ul { margin-top: 8px; margin-left: 4px; }
.box li {
  padding-left: 15px;
  position: relative;
  margin-bottom: 9px;
  color: var(--ink-dim);
}
.box li::before {
  content: '\25B8';
  position: absolute;
  left: 0;
  top: 1px;
  color: var(--ink-dimmer);
  font-size: 9px;
}
.box, .box li, .box p { overflow-wrap: break-word; word-break: break-word; }
.box a { color: #cfcfd4; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: break-word; word-break: break-word; }
.box a:hover { color: var(--ink); }

footer, .footer {
  margin-top: 56px;
  font-size: 9px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: left;
}
footer a, .footer a {
  color: var(--ink-dimmer);
  text-decoration: underline;
  text-underline-offset: 2px;
}
footer a:hover, .footer a:hover { color: var(--ink); }


body { display: flex; flex-direction: column; align-items: center; text-align: center; }

.shell { max-width: 460px; display: flex; flex-direction: column; align-items: center; padding-top: 64px; }

img.logo {
  width: 300px;
  max-width: 78%;
  height: auto;
  margin-bottom: 8px;
  filter: invert(1) grayscale(100%) contrast(1.05);
  transition: transform 0.25s ease, filter 0.25s ease;
}
img.logo:hover { transform: scale(1.04); }

.tagline {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ink-dimmer);
  margin-bottom: 36px;
}
.tagline::before {
  content: '';
  width: 7px; height: 7px;
  background: var(--ink);
  display: inline-block;
  margin-right: 8px;
  animation: blink 1.4s step-end infinite;
}

.content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 380px;
}

a.social, .biolink-btn {
  position: relative;
  width: 100%;
  text-align: center;
  padding: 13px 0;
  font-size: 11px;
  letter-spacing: 2px;
  color: #c7c7cc;
  text-decoration: none;
  border: 1px solid var(--line-soft);
  border-left: 2px solid var(--line-strong);
  overflow: hidden;
  background: var(--panel);
  text-transform: lowercase;
  transition: all 0.2s ease-in-out;
  cursor: pointer;
  display: block;
}

a.social::before, .biolink-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.35) 50%,
    rgba(255,255,255,0) 100%
  );
  transform: skewX(-25deg);
}
a.social:hover::before, .biolink-btn:hover::before { left: 125%; transition: left 0.7s ease-in-out; }

a.social:hover, .biolink-btn:hover {
  color: var(--ink);
  border-left-color: #ffffff;
  background: #0b0b0b;
  box-shadow: -4px 0 20px rgba(255,255,255,0.05);
}

footer {
  margin-top: 44px;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-faint);
}
footer a { color: var(--ink-faint); text-decoration: underline; text-underline-offset: 2px; }
footer a:hover { color: var(--ink-dim); }

/* BIOLINK POP OUT */
.biolink-container { position: relative; width: 100%; }

.popout-menu {
  position: absolute;
  top: 0;
  left: calc(100% + 4px);
  background-color: #060606;
  border: 1px solid var(--line-soft);
  border-left: 2px solid var(--line-strong);
  padding: 14px;
  min-width: 190px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 2;
  text-align: left;
}

.popout-menu a {
  color: #b8b8bc;
  text-decoration: none;
  font-size: 10.5px;
  letter-spacing: 1px;
  transition: color 0.2s ease;
}
.popout-menu a:hover { color: #fff; }

@media (max-width: 500px) {
  .popout-menu {
    position: relative;
    left: 0;
    top: 0;
    width: 100%;
    transform: translateY(-10px);
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.3s ease;
    text-align: center;
  }
  .popout-menu.show {
    opacity: 1;
    max-height: 500px;
    transform: translateY(0);
  }
}

</style>
</head>

const biolinkBtn = document.getElementById('biolinkBtn');
const biolinkMenu = document.getElementById('biolinkMenu');
let hideTimeout;

function showMenu() {
  clearTimeout(hideTimeout);
  biolinkMenu.style.opacity = '1';
  biolinkMenu.style.pointerEvents = 'auto';
}

function hideMenu() {
  hideTimeout = setTimeout(() => {
    biolinkMenu.style.opacity = '0';
    biolinkMenu.style.pointerEvents = 'none';
  }, 200);
}

if (window.innerWidth > 500) {
  biolinkBtn.addEventListener('mouseenter', showMenu);

}

});

});
